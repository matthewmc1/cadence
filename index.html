<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the shell paints under a notch and pads itself with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- --surface: the app bar's ground, so a standalone status bar matches it -->
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Cadence — a private work hub. What comes in becomes work with its context, and gets finished with proof." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <!-- Fonts are self-hosted (src/styles/fonts.css) — no third-party requests. -->
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
